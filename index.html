<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perbandingan Respons Frekuensi IEM</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #0f111a; color: #e6e6e6; padding: 20px; max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 10px; font-size: 22px; }
    .info-note { text-align:center; color:#9ca3af; font-size:13px; margin-bottom:20px; }
    .nav { text-align: right; margin-bottom: 15px; }
    .nav a { color: #3b82f6; text-decoration: none; margin-left: 15px; font-size: 14px; }
    .controls { background: #1a1d2b; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .ref-row { background: #2b2717; padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .select-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    select, button { padding: 10px 15px; border: none; border-radius: 6px; font-size: 14px; }
    select { background: #2a2f45; color: #fff; min-width: 220px; }
    button { background: #3b82f6; color: white; cursor: pointer; }
    button:hover { background: #2563eb; }
    .add-btn { background: #10b981; }
    .add-btn:hover { background: #059669; }
    .del-btn { background: #ef4444; }
    .del-btn:hover { background: #dc2626; }
    .ref-tag { background: #f59e0b; color: #000; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 13px; }
    #chart-container { background: #1a1d2b; padding: 20px; border-radius: 10px; overflow-x: auto; }
    .axis text { fill: #9ca3af; font-size: 12px; }
    .axis path, .axis line { stroke: #4b5563; }
    .grid line { stroke: #2d3246; stroke-dasharray: 3 3; }
    .legend { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .legend-line { width: 25px; height: 3px; border-radius: 2px; }
    .hint { color: #9ca3af; font-size: 13px; margin-top: 12px; }
    .fixed-note { color: #f59e0b; font-size: 13px; margin-left: auto; }
  </style>
</head>
<body>

<h1>🎧 Perbandingan Respons Frekuensi IEM</h1>
<p class="info-note">IEF Neutral 2023 = patokan tetap • Bentuk & skala sama dengan squig.link</p>
<div class="nav">
  <a href="upload.html">➕ Tambah Data Baru (Pemilik)</a>
  <a href="#" onclick="clearAll(); return false;">🗑 Hapus Semua Perbandingan</a>
</div>

<div class="controls">
  <div class="ref-row">
    <span style="width:14px; height:14px; border-radius:3px; background:#f59e0b;"></span>
    <span class="ref-tag">PATOKAN</span>
    <strong>IEF Neutral 2023</strong>
    <span class="fixed-note">🔒 Tetap</span>
  </div>

  <div id="selectContainer"></div>
  
  <button class="add-btn" onclick="addSelectRow()">+ Tambah IEM untuk Dibandingkan</button>
  <p class="hint">💡 Pilih IEM dari daftar — dibandingkan langsung dengan patokan IEF Neutral 2023</p>
</div>

<div id="chart-container">
  <svg id="chart"></svg>
  <div class="legend" id="legend"></div>
</div>

<script>
const margin = {top: 20, right: 30, bottom: 40, left: 50};
const width = 900 - margin.left - margin.right;
const height = 500 - margin.top - margin.bottom;

// Sumbu X: 20Hz → 20kHz (logaritmik)
const x = d3.scaleLog()
  .domain([20, 20000])
  .range([0, width]);

// Sumbu Y: 45–80 dB — batas atas diubah jadi 80 ✅
const y = d3.scaleLinear()
  .domain([45, 80])
  .range([height, 0]);

const svg = d3.select("#chart")
  .attr("width", width + margin.left + margin.right)
  .attr("height", height + margin.top + margin.bottom)
  .append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const colorPalette = [
  "#3b82f6", "#ef4444", "#10b981", "#8b5cf6",
  "#ec4899", "#06b6d4", "#84cc16", "#a855f7",
  "#f97316", "#6366f1", "#14b8a6"
];
const REF_NAME = "IEF Neutral 2023";
const REF_COLOR = "#f59e0b";

let database = {};
let compareRows = [];
let rowIndex = 0;

function drawAxes() {
  svg.selectAll(".axis, .grid").remove();
  const xTicks = [30, 50, 80, 150, 300, 500, 800, 1000, 1500, 2000, 3000, 4000, 5000, 8000, 10000, 15000, 20000];
  const yTicks = [45, 50, 55, 60, 65, 70, 75, 80]; // ✅ sampai 80 dB
  
  svg.append("g").attr("class", "grid")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).tickValues(xTicks).tickFormat("").tickSize(-height));
  
  svg.append("g").attr("class", "grid")
    .call(d3.axisLeft(y).tickValues(yTicks).tickSize(-width).tickFormat(""));
  
  svg.append("g").attr("class", "axis")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).tickValues(xTicks)
      .tickFormat(d => d >= 1000 ? (d/1000)+"k" : d));
  
  svg.append("g").attr("class", "axis")
    .call(d3.axisLeft(y).tickValues(yTicks).tickFormat(d => d + " dB"));
}
drawAxes();

async function loadDatabase() {
  try {
    const res = await fetch("data/index.json?t=" + Date.now());
    database = await res.json();
    addSelectRow();
  } catch (err) {
    document.getElementById("selectContainer").innerHTML = 
      `<p style="color:#ef4444">❌ Gagal memuat data: ${err.message}</p>`;
    console.error(err);
  }
}

function buildSelectOptions() {
  const names = Object.keys(database).filter(n => n !== REF_NAME).sort();
  return `<option value="">-- Pilih IEM --</option>` +
    names.map(name => `<option value="${name}">${name}</option>`).join("");
}

function addSelectRow() {
  rowIndex++;
  const color = colorPalette[(rowIndex - 1) % colorPalette.length];
  
  const container = document.getElementById("selectContainer");
  const row = document.createElement("div");
  row.className = "select-row";
  row.id = `row-${rowIndex}`;
  
  row.innerHTML = `
    <span style="width:12px; height:12px; border-radius:3px; background:${color}; flex-shrink:0;"></span>
    <select id="sel-${rowIndex}" style="border-left: 3px solid ${color}; flex:1;">
      ${buildSelectOptions()}
    </select>
    <button class="del-btn" onclick="removeRow(${rowIndex})">×</button>
  `;
  container.appendChild(row);
  
  const sel = document.getElementById(`sel-${rowIndex}`);
  sel.addEventListener("change", redrawAll);
  compareRows.push({ id: rowIndex, select: sel, color });
  redrawAll();
}

function removeRow(id) {
  const row = document.getElementById(`row-${id}`);
  if (row) row.remove();
  compareRows = compareRows.filter(r => r.id !== id);
  redrawAll();
}

function redrawAll() {
  svg.selectAll(".curve-line").remove();
  
  if (database[REF_NAME]) {
    const refData = database[REF_NAME];
    const refPoints = refData.frequency.map((hz, i) => ({ hz, db: refData.spl[i] }));
    const refLine = d3.line()
      .x(p => x(p.hz))
      .y(p => y(p.db))
      .curve(d3.curveMonotoneX);
    
    svg.append("path")
      .datum(refPoints)
      .attr("class", "curve-line")
      .attr("fill", "none")
      .attr("stroke", REF_COLOR)
      .attr("stroke-width", 2.5)
      .attr("stroke-dasharray", "5,4")
      .attr("d", refLine);
  }
  
  compareRows.forEach(row => {
    const name = row.select.value;
    if (!name || !database[name]) return;
    
    const data = database[name];
    const points = data.frequency.map((hz, i) => ({ hz, db: data.spl[i] }));
    const lineGen = d3.line()
      .x(p => x(p.hz))
      .y(p => y(p.db))
      .curve(d3.curveMonotoneX);
    
    svg.append("path")
      .datum(points)
      .attr("class", "curve-line")
      .attr("fill", "none")
      .attr("stroke", row.color)
      .attr("stroke-width", 2.5)
      .attr("stroke-dasharray", "none")
      .attr("d", lineGen);
  });
  
  updateLegend();
}

function updateLegend() {
  let html = `
    <div class="legend-item">
      <span class="legend-line" style="background:${REF_COLOR}; border:2px dashed ${REF_COLOR}; border-width:2px 0;"></span>
      <span>${REF_NAME} <span class="ref-tag">PATOKAN</span></span>
    </div>`;
  
  compareRows.forEach(row => {
    const name = row.select.value;
    if (!name) return;
    html += `
      <div class="legend-item">
        <span class="legend-line" style="background:${row.color};"></span>
        <span>${name}</span>
      </div>`;
  });
  
  document.getElementById("legend").innerHTML = html;
}

function clearAll() {
  compareRows = [];
  document.getElementById("selectContainer").innerHTML = "";
  rowIndex = 0;
  addSelectRow();
}

loadDatabase();
</script>
</body>
</html>
